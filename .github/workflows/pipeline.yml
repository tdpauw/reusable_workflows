name: pipeline
on:
  workflow_call:
    inputs:
      final_environment:
        description: The final environment to deploy to (e.g., staging, production)
        type: string
        default: production

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy_to_dev:
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' }}
    environment: development
    needs: [build]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.build.outputs.version }}
      environment: development
    secrets: inherit
    
  test_on_dev:
    if: ${{ !failure() && !cancelled() }}
    environment: development
    needs: [deploy_to_dev]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ needs.deploy_to_dev.outputs.version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Tests
      run: make test

  deploy_to_production:
    if: ${{ inputs.final_environment != 'development' && !failure() && !cancelled() }}
    environment: production
    needs: [test_on_dev]
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.test_on_dev.outputs.version }}
      environment: production
    secrets: inherit
